<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 80" role="img" aria-labelledby="title desc">
  <title id="title">Pokedex logo</title>
  <desc id="desc">Logo de la pokedex con una pokeball y texto</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cb2d3e"/>
      <stop offset="100%" stop-color="#ef473a"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="220" height="80" rx="18" fill="url(#bg)"/>

  <g transform="translate(10 8)">
    <path d="M0 32h38" stroke="#111827" stroke-width="6" stroke-linecap="round"/>
    <path d="M38 0a32 32 0 0 1 0 64" fill="none" stroke="#111827" stroke-width="6"/>
    <path d="M38 0a32 32 0 0 0 0 64" fill="none" stroke="#111827" stroke-width="6"/>
    <circle cx="38" cy="32" r="22" fill="#f8fafc" stroke="#111827" stroke-width="6"/>
    <circle cx="38" cy="32" r="9" fill="#ef4444" stroke="#111827" stroke-width="4"/>
    <path d="M0 32h38" stroke="#111827" stroke-width="6" stroke-linecap="round"/>
    <path d="M38 12v40" stroke="#111827" stroke-width="6" stroke-linecap="round"/>
  </g>

  <text x="88" y="49" font-family="Poppins, Arial, sans-serif" font-size="24" font-weight="800" fill="#f8fafc" letter-spacing="1">POKÉDEX</text>
</svg>
